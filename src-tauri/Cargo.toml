[package]
name = "opensoft-profile-switcher"
version = "0.1.0"
description = "Opensoft desktop profile manager for Codex and workBenches AI accounts"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "opensoft_profile_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
opensoft-profile-core = { path = "../crates/profile-core" }
serde.workspace = true
tauri = { version = "2.10", features = [] }
