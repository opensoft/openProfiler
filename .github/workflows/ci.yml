name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p opensoft-open-profiler-core
      - run: cargo clippy -p opensoft-open-profiler-core --all-targets -- -D warnings
      - run: cargo test -p opensoft-open-profiler-broker
      - run: cargo clippy -p opensoft-open-profiler-broker --all-targets -- -D warnings

  account-status-engine:
    name: Account status on ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            image: postgres:17
            protocol: postgres
            port: 5432
          - engine: mariadb
            image: mariadb:11.4
            protocol: mysql
            port: 3306
          - engine: mysql
            image: mysql:8.4
            protocol: mysql
            port: 3306
    env:
      OPENPROFILER_TEST_DB_ENGINE: ${{ matrix.engine }}
      OPENPROFILER_TEST_DB_URL: ${{ matrix.protocol }}://op:fixture@127.0.0.1:33456/profile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Start the isolated database fixture
        env:
          ENGINE: ${{ matrix.engine }}
          IMAGE: ${{ matrix.image }}
          PORT: ${{ matrix.port }}
        run: |
          docker run --rm -d --name profile-db -p "127.0.0.1:33456:$PORT" \
            -e POSTGRES_USER=op -e POSTGRES_PASSWORD=fixture -e POSTGRES_DB=profile \
            -e MARIADB_ROOT_PASSWORD=fixture -e MARIADB_USER=op -e MARIADB_PASSWORD=fixture -e MARIADB_DATABASE=profile \
            -e MYSQL_ROOT_PASSWORD=fixture -e MYSQL_USER=op -e MYSQL_PASSWORD=fixture -e MYSQL_DATABASE=profile "$IMAGE"
          for attempt in {1..45}; do
            case "$ENGINE" in
              postgres) docker exec profile-db pg_isready -h 127.0.0.1 -U op -d profile && exit 0 ;;
              mariadb) docker exec profile-db mariadb -h 127.0.0.1 -uop -pfixture profile -e "SELECT 1" && exit 0 ;;
              mysql) docker exec profile-db mysql -h 127.0.0.1 -uop -pfixture profile -e "SELECT 1" && exit 0 ;;
            esac
            sleep 2
          done
          docker logs profile-db
          exit 1
      - run: cargo test --locked -p opensoft-open-profiler-account-status --test http_status -- --ignored
      - run: python3 integrations/smoke_shared_status.py target/debug/opensoft-open-profiler-account-status "$OPENPROFILER_TEST_DB_ENGINE" "$OPENPROFILER_TEST_DB_URL"
      - run: cargo clippy --locked -p opensoft-open-profiler-account-status --all-targets -- -D warnings

  windows:
    name: Windows core and shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p opensoft-open-profiler-core
      - run: cargo clippy -p opensoft-open-profiler-core --all-targets -- -D warnings
      - run: cargo test -p opensoft-open-profiler-broker
      - run: cargo clippy -p opensoft-open-profiler-broker --all-targets -- -D warnings
      - run: cargo test -p opensoft-open-profiler
      - run: cargo check -p opensoft-open-profiler

  tauri-check:
    name: Tauri shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p opensoft-open-profiler
