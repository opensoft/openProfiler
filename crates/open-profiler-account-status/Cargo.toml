[package]
name = "opensoft-open-profiler-account-status"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["any", "postgres", "mysql", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros"] }
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "fs"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
tower = { version = "0.5", features = ["util"] }
